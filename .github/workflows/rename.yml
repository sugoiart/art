name: Rename Files on Command

on:
  issue_comment:
    types: [created]

jobs:
  rename-on-command:
    runs-on: self-hosted
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/rename') &&
      contains(fromJson('["jckli"]'), github.actor)

    steps:
      - name: Add Reaction to Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Checkout PR Branch (sparse mode, empty)
        uses: actions/checkout@v4
        with:
          repository: sugoiart/art
          token: ${{ secrets.PAT_TOKEN }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          sparse-checkout: |
            .github   # keep workflows folder available
          sparse-checkout-cone-mode: false

      - name: Get Changed Directories
        id: dirs
        run: |
          CHANGED_DIRS=$(git diff --name-only origin/main...HEAD | xargs -n1 dirname | sort -u)
          echo "Changed directories:"
          echo "$CHANGED_DIRS"
          echo "dirs=$CHANGED_DIRS" >> $GITHUB_OUTPUT

      - name: Sparse-checkout only changed dirs
        run: |
          git sparse-checkout set --no-cone ${{ steps.dirs.outputs.dirs }}
          git checkout

      - name: Run rename.sh on PR directories
        run: |
          CHANGED_DIRS="${{ steps.dirs.outputs.dirs }}"
          ARTIST_ID=$(echo "${GITHUB_HEAD_REF}" | awk -F'-' '{print $NF}')

          for d in $CHANGED_DIRS; do
            if [[ -d "$d" ]]; then
              echo "Processing dir: $d"
              echo "y" | ./rename.sh "$d"
            fi
          done

      - name: Commit Renamed Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected, committing renamed files..."
            git add .
            git commit -m "chore: Automatically rename files"
            git push
          else
            echo "No file changes to commit."
          fi

