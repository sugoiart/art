# .github/workflows/debug-comment.yml
name: Debug Comment Trigger

on:
  issue_comment:
    types: [created]

jobs:
  debug-context:
    # This job has no 'if' condition, so it will ALWAYS run when you comment
    runs-on: ubuntu-latest
    steps:
      - name: Print comment context
        run: |
          echo "Comment made by: ${{ github.actor }}"
          echo "Author Association is: ${{ github.event.author_association }}"
          echo "Comment Body is: '${{ github.event.comment.body }}'"
